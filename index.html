<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Harvest</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Навигация">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <div class="brand-name">Live Harvest</div>
          <div class="brand-sub">life os · read-only</div>
        </div>
      </div>
      <nav class="nav" aria-label="Основные экраны">
        <button type="button" class="nav-btn is-active" data-route="home">Обзор</button>
        <button type="button" class="nav-btn" data-route="self">Личность</button>
        <button type="button" class="nav-btn" data-route="universe">Моя вселенная</button>
        <button type="button" class="nav-btn" data-route="capital">Капитал</button>
      </nav>
      <details class="soon">
        <summary>Позже</summary>
        <p>Цели, проекты, финансы, здоровье, дневник, Harvester, Advisor — не готовы. Не маскируем заглушки под продукт.</p>
      </details>
      <div class="rail-foot">SoT · harvest/<br />UI · v0.4.1 · Капитал API :8777</div>
    </aside>

    <div class="workspace">
      <header class="top">
        <div>
          <p class="kicker" id="kicker">Сегодня</p>
          <h1 id="pageTitle">Обзор</h1>
        </div>
        <div class="top-meta">
          <span id="asOf">as of —</span>
          <span id="snapMeta" class="snap-meta">снимок —</span>
          <button type="button" class="btn-refresh" id="btnRefresh" title="Перечитать snapshot.json из harvest">Обновить снимок</button>
        </div>
      </header>
      <main id="stage" class="stage" tabindex="-1"></main>
    </div>
  </div>
  <script src="./vendor/chart.umd.min.js"></script>
  <script src="./data.js"></script>
  <script src="./capital.js"></script>
  <script src="./app.js"></script>
</body>
</html>
